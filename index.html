    // Fallback Mock AI Responses for Physical Education
    const MOCK_AI_DATA = [
      {

        improvementPoint: "배트의 중심과 티 위의 공이 부드럽게 만나도록 시선을 조금 더 고정해 봐요.",
        practiceTip: "공에 그려진 글자나 실밥 무늬를 하나 찍어서 그 점만 보고 배트를 쳐보세요!",
        focusArea: "eyes",
        observationNote: "피니시 자세의 밸런스가 매우 우수하며, 타격 직전 머리의 위치가 약간 들리는 경향이 있습니다."

        goodPoint: "티 위에 놓인 공을 배트의 중심(스위트 스폿)에 탕 맞히는 능력이 뛰어납니다!",
        improvementPoint: "공을 친 후 배트를 끝까지 크게 돌리는 팔로우스루 동작을 유지해 보세요.",
        practiceTip: "공을 치고 나서 배트가 반대쪽 어깨 위까지 넘어가도록 끝까지 돌려보세요.",
        focusArea: "contact",
        observationNote: "배트와 공의 콘택트 타이밍이 적절하며 스윙 후 마무리가 조금 일찍 멈추는 패턴이 보입니다."

    function App() {
      const [appState, setAppState] = useState(initialAppState);
      const [notification, setNotification] = useState(null);
      const [showSafetyGuide, setShowSafetyGuide] = useState(false);
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [apiKey, setApiKey] = useState(() => {
        try {
          // 1. URL 쿼리 파라미터(?key=...)가 있는지 확인
          const params = new URLSearchParams(window.location.search);
          const urlKey = params.get('key');
          if (urlKey) {
            sessionStorage.setItem('gemini_api_key', urlKey.trim());
            // 주소창에서 키 파라미터 지우기 (화면 깔끔하게 정리)
            window.history.replaceState({}, document.title, window.location.pathname);
            return urlKey.trim();
          }
          // 2. 브라우저 세션에 저장된 키 확인
          const storedKey = sessionStorage.getItem('gemini_api_key');
          if (storedKey) return storedKey;
          
          // 3. 코드에 사전 설정된 기본 선생님 키 사용
          return DEFAULT_TEACHER_KEY || "";
        } catch {
          return DEFAULT_TEACHER_KEY || "";
        }
      });
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [isCameraActive, setIsCameraActive] = useState(false);

      // Notification helper (replaces alert)
      const notify = (message, type = 'info') => {
        setNotification({ message, type });
        setTimeout(() => setNotification(null), 4000);
      };

      const handleSaveApiKey = (key) => {
        setApiKey(key);
        try {
          if (key) {
            sessionStorage.setItem('gemini_api_key', key);
          } else {
            sessionStorage.removeItem('gemini_api_key');
          }
        } catch (e) {
          console.error(e);
        }
        setShowSettingsModal(false);
        notify(key ? "Gemini API 키가 설정되었습니다! (실제 AI 분석 가동)" : "API 키가 해제되어 모의 분석(Mock)으로 작동합니다.", "info");
      };

      // Step indicators list
      const STEPS = [
        { id: 1, label: "영상 준비" },
        { id: 2, label: "영상 확인" },
        { id: 3, label: "자기평가" },
        { id: 4, label: "AI 분석" },
        { id: 5, label: "비교하기" },
        { id: 6, label: "목표 정하기" },
        { id: 7, label: "배운점 정리" },
      ];

      // Cleanup blob URLs to prevent memory leaks
      const cleanupUrls = () => {
        if (appState.video1.url && appState.video1.url.startsWith('blob:')) {
          URL.revokeObjectURL(appState.video1.url);
        }
      };

      const handleRestart = () => {
        cleanupUrls();
        setAppState(initialAppState);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleFileUpload = (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        if (!file.type.startsWith('video/')) {
          notify("재생할 수 없는 동영상입니다. 다른 영상을 선택해 주세요.", "error");
          return;
        }

        const objectUrl = URL.createObjectURL(file);
        
        // Inspect video metadata (duration)
        const tempVideo = document.createElement('video');
        tempVideo.preload = 'metadata';
        tempVideo.src = objectUrl;
        tempVideo.onloadedmetadata = () => {
          const duration = tempVideo.duration || 0;
          if (duration > 15) {
            notify("타격 장면이 잘 보이도록 15초 이내의 짧은 영상을 권장해요!", "warning");
          }

          setAppState(prev => ({
            ...prev,
            video1: { file, url: objectUrl, duration },
            currentStep: 2
          }));
        };
        tempVideo.onerror = () => {
          notify("영상을 불러오지 못했어요. 기기의 다른 형식 영상을 선택해 주세요.", "error");
        };
      };

      // Helper function to extract representative frames from uploaded video
      const extractVideoFrames = async (videoUrl, frameCount = 4) => {
        return new Promise((resolve) => {
          const video = document.createElement('video');
          video.src = videoUrl;
          video.crossOrigin = 'anonymous';
          video.muted = true;
          video.playsInline = true;

          const frames = [];

          video.onloadedmetadata = async () => {
            const duration = video.duration || 3;
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            // Downscale to 640px width for fast payload upload to Gemini
            const scale = Math.min(1, 640 / (video.videoWidth || 640));
            canvas.width = (video.videoWidth || 640) * scale;
            canvas.height = (video.videoHeight || 480) * scale;

            const timePoints = [];
            for (let i = 1; i <= frameCount; i++) {
              timePoints.push((duration / (frameCount + 1)) * i);
            }

            for (const time of timePoints) {
              await new Promise((res) => {
                video.currentTime = time;
                video.onseeked = () => {
                  try {
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const base64 = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
                    if (base64) frames.push(base64);
                  } catch (e) {
                    console.error("Frame capture failed", e);
                  }
                  res();
                };
              });
            }
            resolve(frames);
          };

          video.onerror = () => {
            resolve([]);
          };
        });
      };

      const runAiAnalysis = async () => {
        setIsAnalyzing(true);
        setAppState(prev => ({ ...prev, currentStep: 4 }));

        try {
          // If no API Key is set, use kid-friendly realistic Mock AI
          if (!apiKey.trim()) {
            await new Promise(resolve => setTimeout(resolve, 2200));
            const selectedMock = MOCK_AI_DATA[Math.floor(Math.random() * MOCK_AI_DATA.length)];
            setAppState(prev => ({
              ...prev,
              aiAnalysis: selectedMock
            }));
            setIsAnalyzing(false);
            return;
          }

          // Real AI Integration with Gemini Vision API
          const frames = await extractVideoFrames(appState.video1.url, 4);

          const systemPrompt = `당신은 초등학교 5학년 체육 수업을 지원하는 티볼 타격 관찰 보조 AI입니다.
학생의 티볼 타격 연속 스냅샷을 보고 운동 수행 과정에서 관찰 가능한 특징을 분석합니다.

관찰 핵심 항목:
1. 시선: 타격 순간까지 공을 끝까지 바라보는지
2. 준비 자세: 흔들림 없이 안정적인지
3. 타격 동작: 팔만 쓰지 않고 몸통(골반·허리)과 팔의 움직임이 연결되는지
4. 타점: 배트와 공의 만남이 적절한지
5. 타격 후 자세: 균형을 잃지 않고 피니시를 유지하는지

반드시 지켜야 할 엄격한 규칙:
- 비거리나 타구 속도는 절대 평가하지 않습니다.
- 점수, 등급, 순위를 매기지 않습니다.
- 전문적인 운동역학 용어를 쓰지 말고, 초등학교 5학년이 바로 이해할 수 있는 다정하고 쉬운 말투(~해요)를 씁니다.
- 잘한 점은 정확히 1개(goodPoint)만 제시합니다.
- 개선할 점은 정확히 1개(improvementPoint)만 제시합니다.
- 학생이 바로 따라할 수 있는 구체적인 실천 팁 1개(practiceTip)를 제시합니다.
- "더 좋아질 수 있는 점", "다음에 해볼 점"과 같은 긍정적이고 성장 지향적인 어휘를 사용합니다.`;

          const userText = `이 사진들은 초등학교 5학년 학생의 티볼 타격 동작 연속 사진입니다.
학생이 선택한 스스로의 점검:
- 공 보기: ${appState.selfAssessment.eyesOnBall || '미선택'}
- 타격 접촉: ${appState.selfAssessment.contact || '미선택'}
- 몸 사용: ${appState.selfAssessment.bodyMovement || '미선택'}
- 균형 유지: ${appState.selfAssessment.balance || '미선택'}
- 학생이 개선하고 싶은 목표: ${appState.selectedGoal || '몸 사용하기'}

사진 속 학생의 동작을 관찰하고 지정된 JSON 형식으로 분석 결과를 반환해 주세요.`;

          const contentsParts = [{ text: userText }];
          frames.forEach(frameData => {
            contentsParts.push({
              inlineData: {
                mimeType: "image/jpeg",
                data: frameData
              }
            });
          });

          // System payload configured with JSON response requirement
          const payload = {
            contents: [{ parts: contentsParts }],
            systemInstruction: { parts: [{ text: systemPrompt }] },
            generationConfig: {
              responseMimeType: "application/json"
            }
          };

          // Dynamically detect which models are enabled for this specific API key
          let candidateModels = [
            "gemini-2.0-flash",
            "gemini-2.0-flash-exp",
            "gemini-1.5-flash-latest",
            "gemini-1.5-flash"
          ];

          const cleanKey = apiKey.trim();

          // Attempt dynamic model discovery with x-goog-api-key header
          try {
            const listRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${cleanKey}`, {
              headers: {
                'x-goog-api-key': cleanKey
              }
            });
            if (listRes.ok) {
              const listData = await listRes.json();
              if (listData.models && Array.isArray(listData.models)) {
                const supported = listData.models
                  .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent"))
                  .map(m => m.name.replace(/^models\//, ''));
                
                const flashModels = supported.filter(m => m.includes("flash") && !m.includes("audio") && !m.includes("embedding"));
                if (flashModels.length > 0) {
                  candidateModels = [...flashModels, ...supported];
                } else if (supported.length > 0) {
                  candidateModels = supported;
                }
              }
            } else {
              console.warn("Dynamic model lookup skipped, status:", listRes.status);
            }
          } catch (listErr) {
            console.warn("Dynamic model lookup skipped, using fallback list:", listErr);
          }

          let response = null;
          let lastError = null;
          const uniqueModels = [...new Set(candidateModels)];

          for (const model of uniqueModels) {
            try {
              const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${cleanKey}`;
              const res = await fetch(apiUrl, {
                method: 'POST',
                headers: { 
                  'Content-Type': 'application/json',
                  'x-goog-api-key': cleanKey
                },
                body: JSON.stringify(payload)
              });

              if (res.ok) {
                response = res;
                break;
              } else {
                const errDetail = await res.text().catch(() => "");
                console.warn(`Model [${model}] status ${res.status}:`, errDetail);
                lastError = new Error(`구글 서버 오류 (${res.status}): ${errDetail}`);
              }
            } catch (err) {
              console.warn(`Network request failed for [${model}]:`, err);
              lastError = err;
            }
          }

          if (!response || !response.ok) {
            throw lastError || new Error("사용 가능한 Gemini 모델을 찾지 못했습니다.");
          }

          const result = await response.json();
          const jsonText = result.candidates?.[0]?.content?.parts?.[0]?.text;

          if (jsonText) {
            // Safely strip any potential markdown fence wrappers
            let cleanedJson = jsonText.trim();
            if (cleanedJson.startsWith("```")) {
              cleanedJson = cleanedJson.replace(/^```(?:json)?\s*/, '').replace(/\s*```$/, '').trim();
            }
            const parsed = JSON.parse(cleanedJson);
            setAppState(prev => ({
              ...prev,
              aiAnalysis: {
                confidence: parsed.confidence || "high",
                goodPoint: parsed.goodPoint || "공을 끝까지 잘 보고 배트를 휘둘렀어요!",
                improvementPoint: parsed.improvementPoint || "타격할 때 몸통도 함께 회전해 보세요.",
                practiceTip: parsed.practiceTip || "배트를 휘두를 때 배꼽을 치는 방향으로 함께 돌려보세요!",
                focusArea: parsed.focusArea || "body",
                observationNote: parsed.observationNote || "안정적인 타격 준비와 스윙 동작이 관찰되었습니다."
              }
            }));
          } else {
            throw new Error("분석 응답 형식이 올바르지 않습니다.");
          }
        } catch (err) {
          console.error("AI Analysis error:", err);
          notify("실제 AI 호출 중 문제가 발생하여 모의 분석(Mock) 데이터로 표시합니다.", "warning");

    function CameraRecorderView({ onClose, onRecordingFinished, onError }) {
      const videoRef = useRef(null);
      const mediaRecorderRef = useRef(null);
      const streamRef = useRef(null);
      const chunksRef = useRef([]);

      const [isRecording, setIsRecording] = useState(false);
      const [recordSeconds, setRecordSeconds] = useState(0);
      const [recordedBlob, setRecordedBlob] = useState(null);
      const timerRef = useRef(null);

      useEffect(() => {
        let active = true;

        async function initCamera() {
          try {
            // Prioritize environment (rear) camera on mobile/tablet
            const constraints = {
              video: {
                facingMode: { ideal: "environment" },
                width: { ideal: 1280 },
                height: { ideal: 720 }
              },
              audio: false
            };

            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            if (!active) {
              stream.getTracks().forEach(t => t.stop());
              return;
            }

            streamRef.current = stream;
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              videoRef.current.play().catch(e => console.error(e));
            }
          } catch (err) {
            console.error("Camera access failed", err);
            onError("카메라 사용 권한이 없어 바로 촬영할 수 없어요. [기기에서 영상 선택]을 이용해 주세요.");
          }
        }

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          initCamera();
        } else {
          onError("이 기기에서는 바로 촬영할 수 없어요. [기기에서 영상 선택]을 이용해 주세요.");
        }

        return () => {
          active = false;
          if (streamRef.current) {
            streamRef.current.getTracks().forEach(track => track.stop());
          }
          if (timerRef.current) clearInterval(timerRef.current);
        };
      }, []);

      const startRecording = () => {
        if (!streamRef.current) return;
        chunksRef.current = [];
        
        let options = { mimeType: 'video/webm' };
        if (!MediaRecorder.isTypeSupported('video/webm')) {
          if (MediaRecorder.isTypeSupported('video/mp4')) {
            options = { mimeType: 'video/mp4' };
          } else {
            options = {};
          }
        }

        try {
          const recorder = new MediaRecorder(streamRef.current, options);
          recorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) {
              chunksRef.current.push(e.data);
            }
          };

          recorder.onstop = () => {
            const blob = new Blob(chunksRef.current, { type: recorder.mimeType || 'video/webm' });
            setRecordedBlob(blob);
          };

          recorder.start();
          mediaRecorderRef.current = recorder;
          setIsRecording(true);
          setRecordSeconds(0);

          timerRef.current = setInterval(() => {
            setRecordSeconds(s => {
              if (s >= 14) {
                // Auto stop at 15s recommended max
                stopRecording();
                return 15;
              }
              return s + 1;
            });
          }, 1000);
        } catch (err) {
          onError("녹화를 시작할 수 없습니다. 기기 설정을 확인해 주세요.");
        }
      };

      const stopRecording = () => {
        if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
          mediaRecorderRef.current.stop();
        }
        if (timerRef.current) clearInterval(timerRef.current);
        setIsRecording(false);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black flex flex-col justify-between text-white p-4">
          {/* Header */}
          <div className="flex items-center justify-between z-10">
            <span className="bg-black/60 px-4 py-2 rounded-full text-sm sm:text-base font-bold">
              몸 전체와 배트가 보이게 찍어 주세요
            </span>
            <button
              onClick={onClose}
              className="px-4 py-2 bg-white/20 hover:bg-white/30 rounded-full font-bold text-sm"
            >
              닫기
            </button>
          </div>

          {/* Video Stream or Preview */}
          <div className="relative flex-1 flex items-center justify-center my-2 overflow-hidden rounded-3xl bg-slate-950">
            {!recordedBlob ? (
              <video
                ref={videoRef}
                playsInline
                muted
                autoPlay
                className="w-full h-full object-contain"
              />
            ) : (
              <video
                src={URL.createObjectURL(recordedBlob)}
                controls
                playsInline
                autoPlay
                className="w-full h-full object-contain"
              />
            )}

            {/* Recording badge */}
            {isRecording && (
              <div className="absolute top-4 left-4 bg-rose-600 text-white font-extrabold px-3 py-1.5 rounded-full flex items-center gap-2 animate-pulse">
                <span className="w-3 h-3 rounded-full bg-white"></span>
                <span>녹화 중: {recordSeconds}초</span>
              </div>
            )}
          </div>

          {/* Bottom Action Controllers */}
          <div className="flex items-center justify-center p-3 z-10">
            {!recordedBlob ? (
              <div>
                {!isRecording ? (
                  <button
                    onClick={startRecording}
                    className="w-20 h-20 rounded-full bg-rose-600 border-4 border-white flex items-center justify-center shadow-xl active:scale-95 transition"
                  >
                    <span className="w-8 h-8 rounded-full bg-white"></span>
                  </button>
                ) : (
                  <button
                    onClick={stopRecording}
                    className="w-20 h-20 rounded-full bg-slate-800 border-4 border-white flex items-center justify-center shadow-xl active:scale-95 transition"
                  >
                    <span className="w-8 h-8 rounded-md bg-rose-600"></span>
                  </button>
                )}
              </div>
            ) : (
              <div className="flex gap-4 w-full max-w-md">
                <button
                  onClick={() => {
                    setRecordedBlob(null);
                    // Re-bind live stream to video element
                    setTimeout(() => {
                      if (videoRef.current && streamRef.current) {
                        videoRef.current.srcObject = streamRef.current;
                        videoRef.current.play().catch(e => console.error(e));
                      }
                    }, 100);
                  }}
                  className="flex-1 py-4 px-5 rounded-2xl bg-white/20 hover:bg-white/30 text-white font-bold text-lg"
                >
                  다시 촬영
                </button>
                <button
                  onClick={() => onRecordingFinished(recordedBlob)}
                  className="flex-1 py-4 px-5 rounded-2xl bg-emerald-500 hover:bg-emerald-600 text-white font-kids-title text-2xl font-bold shadow-lg"
                >
                  사용하기
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
